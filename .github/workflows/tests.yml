name: Panel tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Klipper3d/klipper
          ref: 29d4ec2d6d840ee839333306003a400da186d41d
          path: .klipper-test-source
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          KLIPPER_GCODE_PATH: .klipper-test-source/klippy/gcode.py
      - run: python panel.py --preview preview.png
      - run: python firmware/build.py .klipper-test-source
      - run: python firmware/verify.py .klipper-test-source
