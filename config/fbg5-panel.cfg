# Include only after installing fsmc_touch.py and the custom FSMC firmware.
[fsmc_touch]
cs_pin: PA7
spi_bus: spi2
spi_speed: 1000000
deselect_pins: PB12
shutdown_ui: True

[gcode_macro FBG_PANEL_HEAT]
description: Guarded nozzle heating from the physical panel
gcode:
    {% set t = params.TEMP|default(0)|float %}
    {% if printer.print_stats.state not in ['standby', 'complete', 'cancelled'] or printer.virtual_sdcard.is_active or printer.pause_resume.is_paused %}
        {action_raise_error('Panel heating requires idle printer')}
    {% endif %}
    {% if t != t or (t != 0 and (t < 170 or t > 240 or t >= printer.configfile.settings.extruder.max_temp)) %}
        {action_raise_error('Panel temperature outside allowed range')}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={t}

[gcode_macro FBG_PANEL_EXTRUDE]
description: Bounded extrusion; preserve all G-code modes and wait for one step
gcode:
    {% set d = params.DIST|float %}
    {% set speed = params.SPEED|float %}
    {% if printer.print_stats.state not in ['standby', 'complete', 'cancelled'] or printer.virtual_sdcard.is_active or printer.pause_resume.is_paused %}
        {action_raise_error('Panel extrusion requires idle printer')}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error('Nozzle is too cold')}
    {% endif %}
    {% if d != d or speed != speed or d < -1 or d > 1 or speed < 1 or speed > 5 %}
        {action_raise_error('Panel extrusion outside allowed range')}
    {% endif %}
    SAVE_GCODE_STATE NAME=FBG_PANEL
    M83
    M220 S100
    M221 S100
    G1 E{d} F{speed*60}
    RESTORE_GCODE_STATE NAME=FBG_PANEL MOVE=0
    M400

[gcode_macro FBG_PANEL_RESTART]
description: Restart only while idle and heater targets are zero
gcode:
    {% if printer.print_stats.state not in ['standby', 'complete', 'cancelled'] or printer.virtual_sdcard.is_active or printer.pause_resume.is_paused %}
        {action_raise_error('Panel restart requires idle printer')}
    {% endif %}
    {% if printer.extruder.target > 0 or printer.heater_bed.target > 0 %}
        {action_raise_error('Turn off heaters before restart')}
    {% endif %}
    {% if params.MCU|default(0)|int %}
        FIRMWARE_RESTART
    {% else %}
        RESTART
    {% endif %}
